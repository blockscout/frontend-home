name: Checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run lint:children
      - run: npm ci
      - run: npm run lint:tsc
      - run: npm test
      # The shared skills and rules name the children's files, so doc-links checks them in the children.
      - name: Clone the children
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          ./scripts/bootstrap.sh --depth 1
      - run: npm run lint:doc-links
